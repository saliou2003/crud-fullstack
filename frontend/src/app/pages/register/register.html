<div class="register-container">
  <mat-form-field appearance="outline">
    <mat-label>Username</mat-label>
    <input matInput [(ngModel)]="user.username" placeholder="Username">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput type="password" [(ngModel)]="user.password" placeholder="Password">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Rôle</mat-label>
    <mat-select [(ngModel)]="user.role">
      <mat-option value="ROLE_USER">User</mat-option>
      <mat-option value="ROLE_ADMIN">Admin</mat-option>
    </mat-select>
  </mat-form-field>

  <p *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</p>

  <button mat-raised-button color="primary" (click)="register()">S'inscrire</button>

  <p>Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
</div>
